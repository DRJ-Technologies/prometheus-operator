name: Export Alloy reloader ARM64 OCI

on:
  workflow_call:
    inputs:
      source_sha:
        description: Current main commit of DRJ-Technologies/prometheus-operator
        required: true
        type: string

permissions:
  contents: read

jobs:
  export:
    if: >-
      github.repository == 'DRJ-Technologies/k8s' &&
      github.event.repository.private == true &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      # Native Dockerfile appends -base to GOLANG_BUILDER; bind that image
      # context without replacing its version argument or Make build recipe.
      GOLANG_BUILDER_IMAGE: quay.io/prometheus/golang-builder@sha256:fc013154ceddeaab02e5bb96e9f6549d77230851e55b3cb90cbdaba9d5dc5431
      BUILDX_METADATA_PROVENANCE: max
      SOURCE_SHA: ${{ inputs.source_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: DRJ-Technologies/prometheus-operator
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0
      - name: Export native reloader final stage
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = x86_64
          [[ "$SOURCE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git rev-parse refs/remotes/origin/main)" = "$SOURCE_SHA"
          source_status="$(git status --porcelain --untracked-files=all)"
          test -z "$source_status"
          # Retain real Git metadata in the path context for native Make stamps.
          git switch --create main
          test -d .git
          out="$RUNNER_TEMP/reloader-export"
          mkdir -p "$out"
          builder_version="$(sed -n 's/^ARG GOLANG_BUILDER=//p' cmd/prometheus-config-reloader/Dockerfile)"
          test -n "$builder_version"
          # No outer --platform: the AMD64 builder cross-compiles GOARCH, and
          # the unmodified final FROM selects linux/arm64 without runtime RUN.
          docker buildx build \
            --build-arg OS=linux --build-arg GOARCH=arm64 \
            --build-context "quay.io/prometheus/golang-builder:${builder_version}-base=docker-image://${GOLANG_BUILDER_IMAGE}" \
            --file cmd/prometheus-config-reloader/Dockerfile \
            --progress plain --provenance=mode=max \
            --metadata-file "$out/build-metadata.json" \
            --output "type=oci,dest=$out/reloader-arm64.oci.tar" \
            . 2>&1 | tee "$out/build.log"
      - name: Retain OCI, native build log and provenance materials
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: alloy-reloader-arm64-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/reloader-export/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
